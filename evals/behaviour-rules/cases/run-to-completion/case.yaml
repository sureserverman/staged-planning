schema_version: "1.1"
name: run-to-completion
description: "Rule run-to-completion: a two-stage plan with nothing to stop for is driven through both stages without asking whether to continue."
tags: [behaviour-rules, run-to-completion]
expected_outcome: "All four task Status boxes ticked; the final message ends the run without asking whether to continue."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Execute the plan at docs/plans/2026-01-15-four-notes-plan.md with the executing-plans skill.
