schema_version: "1.1"
name: run-to-completion-control
description: "Sabotage control for run-to-completion: the prompt adds one line telling the session to stop after Stage 1 and ask. A sound grader scores this run below 0.5."
tags: [behaviour-rules, run-to-completion, control]
expected_outcome: "Only the two Stage 1 tasks ticked and the run ending on a question about Stage 2, so every grader fails."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Execute the plan at docs/plans/2026-01-15-four-notes-plan.md with the executing-plans skill.
    When the Stage 1 gate passes, stop and ask me whether to continue before you start Stage 2.
