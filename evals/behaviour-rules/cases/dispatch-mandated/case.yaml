schema_version: "1.1"
name: dispatch-mandated
description: "Rule dispatch-without-asking: a plan whose two tasks are Dispatch: YES has them sent to subagents with no confirmation turn first."
tags: [behaviour-rules, dispatch-without-asking]
expected_outcome: "Each task handed to a subagent through the Agent tool, with no question to the user before the first dispatch."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Execute the plan at docs/plans/2026-01-15-dispatched-notes-plan.md with the executing-plans skill.
