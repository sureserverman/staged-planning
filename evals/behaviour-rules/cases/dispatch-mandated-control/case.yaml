schema_version: "1.1"
name: dispatch-mandated-control
description: "Sabotage control for dispatch-mandated: the prompt adds one line telling the session it must do both tasks itself. A sound grader scores this run below 0.5."
tags: [behaviour-rules, dispatch-without-asking, control]
expected_outcome: "Both tasks done in the main session with no Agent call naming them, so both dispatched-task graders fail."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Execute the plan at docs/plans/2026-01-15-dispatched-notes-plan.md with the executing-plans skill.
    Do both tasks yourself in this session; do not hand either one to a subagent.
