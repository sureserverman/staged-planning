hooks/dispatch-log.sh:
  base_sha256: 84d74a452f78bf8c8c8b1528e3019852942acef9b373318ab2a26c2791d1fc5f
  host_fact: 'Cursor sent no subagentStart or subagentStop event in any probe mode, and its preToolUse hook (matcher Task) is a permission hook that runs from the plugin folder, so the fork logs dispatch lines only, on preToolUse: it answers {"permission":"allow"}, takes the repo from the payload''s workspace_roots, logs tool_input.subagent_type (empty when absent), and writes one line per tool_use_id, because an entry on both routes ran it twice for one call.'
  depends_on:
    hooks/plan_continue_classify.py: da899becc6b710ca5ea2c67d1e366710ae5cf4c66afd33f4e70b3485e4a9f949
hooks/git-ref-gate.sh:
  base_sha256: ecbdc42145a996805a2492846c2ffae96f689b1e54593d3021056aa2b4b669d3
  host_fact: 'On Cursor an executor left to choose proved only the claims it picked, and it installs nothing it is not told to, so proof there is every claim, once per stage at the gate, and on while a plan is in flight: the fork gates the Stage N green commit, needs a record for every claim of every task of stage N, and its shim is installed by the Cursor hooks installer, which the beforeShellExecution commit gate enforces.'
  depends_on:
    hooks/plan_continue_classify.py: da899becc6b710ca5ea2c67d1e366710ae5cf4c66afd33f4e70b3485e4a9f949
    skills/executing-plans/scripts/prove-claim.py: 4b89444d9feec8e9587f2b37e59fa50a61e672d81b398e95649132e3325d97ae
hooks/plan-continue.sh:
  base_sha256: 43113fb2ba0eaa385c941e242696bf64b86118fce0d408bb774c0a35d8aa6fe2
  host_fact: A Cursor stop hook answers with followup_message, which Cursor submits as the next user message, its payload carries no message text, and it fires only in an interactive session, run from the workspace root; so the fork continues every stop of a plan in flight that the execution state does not record as a stop, finds the repo from workspace_roots, keys the conversation by conversation_id and finds its siblings from its own resolved path.
  depends_on:
    hooks/plan_continue_classify.py: da899becc6b710ca5ea2c67d1e366710ae5cf4c66afd33f4e70b3485e4a9f949
