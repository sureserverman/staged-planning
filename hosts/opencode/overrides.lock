skills/executing-plans/scripts/context-usage.py:
  base_sha256: 9b19c08c62ca44d19e6f9b5b56a7e34c2e4c4dc111bc25f56dbc0e732db88ce4
  host_fact: 'OpenCode keeps no transcript file and sets no session id in a shell''s environment: it records each model call''s token use in its SQLite session store (opencode.db in its data directory) and each model''s context limit in its models cache, so the fork reads those, newest top-level session for the working directory unless --session names one; the rollover-request rule and the sidecar writer go with the handoff envelope and the planning mod, which OpenCode does not ship.'
skills/executing-plans/scripts/plan-progress.py:
  base_sha256: a0eb16133738ed1f41772bcca134eab39014b8f5f6c9d41186950a580f734a20
  host_fact: OpenCode has no status line a plugin or a command can feed, so the status-line renderer and its --json model can never run; the fork ships the budget, stage-order and dispatch checks byte-identical and exits 64 on any other argument.
