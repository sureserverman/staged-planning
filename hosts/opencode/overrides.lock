skills/executing-plans/scripts/validate-stack-routing.py:
  base_sha256: 25b8f76e828df535a7e1270559709e367fec4068668665e8886cdaf9581d7bb2
  host_fact: OpenCode registers an agent under its file name (agents/<name>.md carries no name field), has no plugin namespacing, and its built-in subagents are general and explore, so the fork reads the shipped agents from their file names, accepts the bare name and refuses a planning:<name> id.
