hooks/dispatch-log.sh:
  base_sha256: 84d74a452f78bf8c8c8b1528e3019852942acef9b373318ab2a26c2791d1fc5f
  host_fact: Codex sets no project-folder variable in a hook's environment and its spawn call carries no description or agent type a tool-use hook could log, so the fork takes the project from the payload's cwd, reading the payload once from stdin, and logs SubagentStart and SubagentStop only.
  depends_on:
    hooks/plan_continue_classify.py: b99ff822dfac794dfd7d1bec974e99ddf2ade350e509ecf3748cda57f4a6aaa4
hooks/plan-continue.sh:
  base_sha256: 43113fb2ba0eaa385c941e242696bf64b86118fce0d408bb774c0a35d8aa6fe2
  host_fact: A final message ends a Codex turn and nothing resumes it (there is no task notification), so the Stop fork, opt-in per session with CODEX_PLAN_CONTINUE=1, continues every final stop of a plan in flight that the state does not record as a stop, reading Codex's last_assistant_message.
  depends_on:
    hooks/plan_continue_classify.py: b99ff822dfac794dfd7d1bec974e99ddf2ade350e509ecf3748cda57f4a6aaa4
